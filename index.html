<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagerbestand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root {
  --bg:         #18181a;
  --surface:    #222224;
  --surface2:   #2c2c2f;
  --border:     #3c3c40;
  --accent:     #e8920a;
  --accent-dim: rgba(232,146,10,.12);
  --text:       #f0ede8;
  --text2:      #888580;
  --danger:     #d94040;
  --danger-dim: rgba(217,64,64,.12);
  --radius:     10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }

/* ── LOGIN ─────────────────────────────────────────────── */
#view-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
#view-login::before { content: ''; position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(232,146,10,.07) 0%, transparent 65%); top: 50%; left: 50%; transform: translate(-50%, -55%); pointer-events: none; }
.login-box { width: 100%; max-width: 340px; padding: 2rem; text-align: center; }
.login-logo { font-family: 'Barlow Condensed', sans-serif; font-size: 3.5rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1; margin-bottom: .2rem; }
.login-logo span { color: var(--accent); }
.login-sub { font-family: 'IBM Plex Mono', monospace; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text2); margin-bottom: 2.5rem; }
.login-input { width: 100%; padding: .9rem 1.2rem; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 1rem; font-family: 'IBM Plex Mono', monospace; letter-spacing: .05em; text-align: center; margin-bottom: .75rem; transition: border-color .2s; }
.login-input:focus { outline: none; border-color: var(--accent); }
.login-input.error { border-color: var(--danger); animation: shake .35s ease; }
.login-btn { width: 100%; padding: .9rem; background: var(--accent); color: #18181a; border: none; border-radius: var(--radius); font-family: 'Barlow Condensed', sans-serif; font-size: 1.15rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: opacity .15s, transform .15s; }
.login-btn:hover { opacity: .88; transform: translateY(-1px); }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

/* ── NAV ───────────────────────────────────────────────── */
nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.nav-brand { font-family: 'Barlow Condensed', sans-serif; font-size: 1.5rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; text-decoration: none; color: var(--text); cursor: pointer; }
.nav-brand span { color: var(--accent); }
.nav-new { padding: .42rem 1.1rem; background: var(--accent); color: #18181a; border: none; border-radius: 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: opacity .15s; }
.nav-new:hover { opacity: .85; }

/* ── MAIN ──────────────────────────────────────────────── */
main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
.view { display: none; animation: fadeUp .2s ease; }
.view.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── SEARCH ────────────────────────────────────────────── */
.search-wrap { margin-bottom: 1.5rem; }
.search-input { width: 100%; padding: .65rem 1rem; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); font-size: .95rem; font-family: 'IBM Plex Sans', sans-serif; transition: border-color .2s; }
.search-input:focus { outline: none; border-color: var(--accent); }
.search-input::placeholder { color: var(--text2); }

/* ── ITEM GRID ─────────────────────────────────────────── */
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
.item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: border-color .2s, transform .2s, box-shadow .2s; }
.item-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,.35); }
.item-thumb { height: 148px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; overflow: hidden; }
.item-thumb img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: .85rem 1rem; }
.card-name { font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: .25rem; }
.card-meta { font-size: .77rem; color: var(--text2); font-family: 'IBM Plex Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta + .card-meta { margin-top: .1rem; }

/* ── BADGES ────────────────────────────────────────────── */
.card-badges { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .45rem; }
.badge { display: inline-flex; align-items: center; padding: .12rem .45rem; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: .62rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
.badge-category { background: var(--accent-dim); color: var(--accent); }
.badge-lent     { background: rgba(100,160,255,.15); color: #7ab3ff; }
.badge-defect   { background: var(--danger-dim); color: var(--danger); }

/* ── EMPTY / LOADING ───────────────────────────────────── */
.empty { text-align: center; padding: 5rem 1rem; color: var(--text2); }
.empty-icon { font-size: 3rem; opacity: .35; margin-bottom: 1rem; }
.empty p { margin-bottom: 1.25rem; }
.loading { display: flex; align-items: center; justify-content: center; padding: 4rem; color: var(--text2); gap: .75rem; font-family: 'IBM Plex Mono', monospace; font-size: .82rem; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── BACK LINK ─────────────────────────────────────────── */
.back-link { display: inline-flex; align-items: center; gap: .35rem; color: var(--text2); text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: .82rem; margin-bottom: 1.5rem; transition: color .15s; cursor: pointer; background: none; border: none; }
.back-link:hover { color: var(--accent); }

/* ── DETAIL ────────────────────────────────────────────── */
.detail-layout { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
.detail-photo { border-radius: var(--radius); overflow: hidden; background: var(--surface); border: 1px solid var(--border); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 5rem; }
.detail-photo img { width: 100%; height: 100%; object-fit: cover; }
.item-title { font-family: 'Barlow Condensed', sans-serif; font-size: 2.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: 1; margin-bottom: 1.5rem; }
.info-block { margin-bottom: 1rem; }
.info-label { font-size: .68rem; font-family: 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: .2rem; }
.info-value { font-size: .95rem; line-height: 1.55; }
.detail-actions { display: flex; gap: .7rem; margin-top: 2rem; flex-wrap: wrap; }

/* ── STATUS BOX ────────────────────────────────────────── */
.status-box { display: flex; align-items: flex-start; gap: .75rem; padding: .85rem 1rem; border-radius: 8px; margin-bottom: .75rem; font-size: .88rem; }
.status-box-lent   { background: rgba(100,160,255,.1); border: 1px solid rgba(100,160,255,.25); }
.status-box-defect { background: var(--danger-dim); border: 1px solid rgba(217,64,64,.25); }
.status-box-icon   { font-size: 1.1rem; flex-shrink: 0; margin-top: .05rem; }
.status-box-text strong { display: block; font-weight: 600; margin-bottom: .1rem; color: #7ab3ff; }
.status-box-defect .status-box-text strong { color: var(--danger); }
.status-box-text small { font-family: 'IBM Plex Mono', monospace; font-size: .75rem; color: var(--text2); }

/* ── LEND FORM ─────────────────────────────────────────── */
.lend-form { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
.lend-input { flex: 1; min-width: 140px; padding: .5rem .8rem; background: var(--bg); border: 1.5px solid var(--border); border-radius: 7px; color: var(--text); font-size: .9rem; font-family: 'IBM Plex Sans', sans-serif; transition: border-color .2s; }
.lend-input:focus { outline: none; border-color: #7ab3ff; }
.lend-input::placeholder { color: var(--text2); }

/* ── BUTTONS ───────────────────────────────────────────── */
.btn { padding: .58rem 1.3rem; border-radius: 7px; font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: .3rem; transition: opacity .15s, transform .15s; }
.btn:hover { opacity: .85; transform: translateY(-1px); }
.btn:active { transform: none; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn-primary { background: var(--accent); color: #18181a; }
.btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-outline { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }
.btn-danger  { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(217,64,64,.25); }
.btn-danger:hover { background: var(--danger); color: white; opacity: 1; }
.btn-ok { background: rgba(100,160,255,.15); color: #7ab3ff; border: 1px solid rgba(100,160,255,.3); }

/* ── FORM ──────────────────────────────────────────────── */
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; max-width: 540px; }
.form-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.9rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 1.5rem; }
.form-group { margin-bottom: 1.1rem; }
.form-label { display: block; font-size: .68rem; font-family: 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--text2); margin-bottom: .35rem; }
.form-input, .form-textarea { width: 100%; padding: .65rem .9rem; background: var(--bg); border: 1.5px solid var(--border); border-radius: 7px; color: var(--text); font-size: .95rem; font-family: 'IBM Plex Sans', sans-serif; transition: border-color .2s; }
.form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
.form-textarea { min-height: 88px; resize: vertical; }
.form-input[type="file"] { padding: .5rem .9rem; color: var(--text2); cursor: pointer; }
.form-input[type="file"]::file-selector-button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: .3rem .75rem; margin-right: .75rem; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: .9rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; transition: background .15s; }
.form-input[type="file"]::file-selector-button:hover { background: var(--border); }
.current-photo-wrap { margin-top: .6rem; display: flex; align-items: center; gap: 1rem; }
.current-photo-thumb { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); }
.remove-label { font-size: .78rem; color: var(--danger); cursor: pointer; display: flex; align-items: center; gap: .3rem; font-family: 'IBM Plex Mono', monospace; }
.form-actions { display: flex; gap: .75rem; margin-top: 1.5rem; }

/* ── PRINT ─────────────────────────────────────────────── */
.print-page { max-width: 380px; margin: 0 auto; text-align: center; }
.print-label { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; display: inline-block; width: 100%; }
#qr-canvas { border-radius: 6px; }
.print-name { font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; margin: .9rem 0 .35rem; }
.print-loc { font-family: 'IBM Plex Mono', monospace; font-size: .85rem; color: var(--text2); margin-bottom: .4rem; }
.print-url { font-size: .62rem; color: var(--text2); word-break: break-all; opacity: .5; }
.print-actions { margin-top: 1.5rem; display: flex; gap: .75rem; justify-content: center; }

/* ── TOAST ─────────────────────────────────────────────── */
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: .7rem 1.5rem; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: .82rem; transition: transform .3s ease; z-index: 9999; white-space: nowrap; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.err  { border-color: var(--danger); color: var(--danger); }

/* ── RESPONSIVE ────────────────────────────────────────── */
@media (max-width: 680px) { .detail-layout { grid-template-columns: 1fr; } .detail-photo { width: 100%; max-width: 280px; margin: 0 auto; } .item-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 420px) { .item-grid { grid-template-columns: 1fr; } main { padding: 1rem; } }
@media print {
  body { background: white; color: black; }
  nav, .back-link, .print-actions { display: none !important; }
  #view-overview, #view-detail, #view-form, #view-login { display: none !important; }
  #view-print { display: block !important; }
  .print-label { border: 2px solid #333; background: white; }
  .print-name, .print-loc { color: black; }
  .print-url { color: #555; opacity: 1; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="view-login">
  <div class="login-box">
    <div class="login-logo">LAGER<span>.</span></div>
    <div class="login-sub">Bestandsverwaltung</div>
    <input id="pw-input" class="login-input" type="password" placeholder="Passwort" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Einloggen →</button>
  </div>
</div>

<!-- NAV -->
<nav id="app-nav" style="display:none">
  <div class="nav-brand" onclick="showOverview()">LAGER<span>.</span></div>
  <button class="nav-new" onclick="showForm(null)">+ Neu</button>
</nav>

<main id="app-main" style="display:none">

  <!-- OVERVIEW -->
  <div class="view" id="view-overview">
    <div class="search-wrap">
      <input class="search-input" id="search-input" type="search"
             placeholder="Suchen nach Name, Ort oder Kategorie…"
             oninput="filterItems()" autocomplete="off">
    </div>
    <div id="grid-wrap"></div>
  </div>

  <!-- DETAIL -->
  <div class="view" id="view-detail">
    <button class="back-link" id="detail-back">← Übersicht</button>
    <div id="detail-body"></div>
  </div>

  <!-- FORM -->
  <div class="view" id="view-form">
    <button class="back-link" id="form-back">← Zurück</button>
    <div class="form-card">
      <div class="form-title" id="form-title">Neuer Eintrag</div>
      <form id="item-form" onsubmit="submitForm(event)">
        <input type="hidden" id="f-id">
        <div class="form-group">
          <label class="form-label">Name *</label>
          <input class="form-input" id="f-name" type="text" required placeholder="z.B. Kettensäge Stihl MS 250">
        </div>
        <div class="form-group">
          <label class="form-label">Kategorie</label>
          <input class="form-input" id="f-category" type="text" list="cat-list"
                 placeholder="z.B. Handwerkzeug, Forstwerkzeug…">
          <datalist id="cat-list"></datalist>
        </div>
        <div class="form-group">
          <label class="form-label">Beschreibung</label>
          <textarea class="form-textarea" id="f-desc" placeholder="z.B. 45cm Schwert, benzinbetrieben"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Aufbewahrungsort</label>
          <input class="form-input" id="f-loc" type="text" placeholder="z.B. Werkstatt, Regal links">
        </div>
        <div class="form-group">
          <label class="form-label">Menge / Anzahl</label>
          <input class="form-input" id="f-qty" type="text" placeholder="z.B. 1 oder 5 Liter">
        </div>
        <div class="form-group">
          <label class="form-label">Foto</label>
          <input class="form-input" id="f-photo" type="file" accept="image/*">
          <div id="photo-existing" style="display:none" class="current-photo-wrap">
            <img id="photo-thumb" class="current-photo-thumb" src="" alt="">
            <label class="remove-label">
              <input type="checkbox" id="f-rm-photo"> Foto entfernen
            </label>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="f-submit">Hinzufügen</button>
          <button type="button" class="btn btn-ghost" id="f-cancel">Abbrechen</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PRINT -->
  <div class="view" id="view-print">
    <button class="back-link" id="print-back">← Zurück</button>
    <div class="print-page">
      <div class="print-label">
        <img id="qr-img" alt="" style="width:200px;height:200px;border-radius:6px;display:block;margin:0 auto;">
        <div class="print-name" id="print-name"></div>
        <div class="print-loc"  id="print-loc"></div>
        <div class="print-url"  id="print-url"></div>
      </div>
      <div class="print-actions">
        <button class="btn btn-primary" onclick="window.print()">Drucken</button>
        <button class="btn btn-ghost" id="print-back2">Zurück</button>
      </div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://rivkvtxrrwtdfihnbpvk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TK2eTLKc04wExkBsglNIGg_Vxl1DuUQ';
const APP_PW       = 'Winterleiten1!';
const BUCKET       = 'fotos';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── AUTH ─────────────────────────────────────────────────
const authed = () => localStorage.getItem('lb_ok') === '1';
function doLogin() {
  const el = document.getElementById('pw-input');
  if (el.value === APP_PW) { localStorage.setItem('lb_ok', '1'); bootApp(); }
  else { el.classList.add('error'); setTimeout(() => el.classList.remove('error'), 400); el.value = ''; el.focus(); }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ── BOOT ─────────────────────────────────────────────────
function bootApp() {
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('app-nav').style.display    = 'flex';
  document.getElementById('app-main').style.display   = 'block';
  handleHash();
}
if (authed()) bootApp();
else document.getElementById('pw-input').focus();

// ── ROUTING ──────────────────────────────────────────────
window.addEventListener('hashchange', () => { if (authed()) handleHash(); });
function handleHash() {
  const h = location.hash.slice(1);
  if      (h.startsWith('detail/')) showDetail(+h.slice(7));
  else if (h.startsWith('edit/'))   showForm(+h.slice(5));
  else if (h.startsWith('print/'))  showPrint(+h.slice(6));
  else                               showOverview();
}
function setHash(h) { location.hash = h; }
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
}

// ── OVERVIEW ─────────────────────────────────────────────
let allItems = [];

async function showOverview() {
  setHash('');
  showView('overview');
  document.getElementById('search-input').value = '';
  const wrap = document.getElementById('grid-wrap');
  wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Lade…</div>';
  const { data, error } = await sb.from('items').select('*').order('name');
  if (error) { wrap.innerHTML = '<div class="loading">Fehler beim Laden.</div>'; return; }
  allItems = data || [];
  renderGrid(allItems);
  setTimeout(() => document.getElementById('search-input').focus(), 80);
}

function renderGrid(items) {
  const wrap = document.getElementById('grid-wrap');
  if (!items.length) {
    wrap.innerHTML = `<div class="empty"><div class="empty-icon">🔧</div><p>Noch keine Gegenstände erfasst.</p><button class="btn btn-primary" onclick="showForm(null)">Ersten Eintrag anlegen</button></div>`;
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'item-grid';
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.onclick = () => setHash('detail/' + item.id);
    const badges = [
      item.category   ? `<span class="badge badge-category">${esc(item.category)}</span>` : '',
      item.lent_to    ? `<span class="badge badge-lent">Verliehen</span>` : '',
      item.is_defective ? `<span class="badge badge-defect">Defekt</span>` : ''
    ].filter(Boolean).join('');
    card.innerHTML = `
      <div class="item-thumb">${item.photo_url ? `<img src="${esc(item.photo_url)}" loading="lazy">` : '🔧'}</div>
      <div class="card-body">
        <div class="card-name">${esc(item.name)}</div>
        ${item.location ? `<div class="card-meta">📍 ${esc(item.location)}</div>` : ''}
        ${item.quantity ? `<div class="card-meta">× ${esc(item.quantity)}</div>`  : ''}
        ${badges ? `<div class="card-badges">${badges}</div>` : ''}
      </div>`;
    grid.appendChild(card);
  });
  wrap.innerHTML = '';
  wrap.appendChild(grid);
}

function filterItems() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  renderGrid(q ? allItems.filter(i =>
    (i.name + ' ' + (i.location||'') + ' ' + (i.category||'')).toLowerCase().includes(q)
  ) : allItems);
}

// ── DETAIL ───────────────────────────────────────────────
async function showDetail(id) {
  showView('detail');
  document.getElementById('detail-back').onclick = showOverview;
  const wrap = document.getElementById('detail-body');
  wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Lade…</div>';
  const { data: item, error } = await sb.from('items').select('*').eq('id', id).single();
  if (error || !item) { wrap.innerHTML = '<div class="loading">Nicht gefunden.</div>'; return; }
  const date = new Date(item.created_at).toLocaleDateString('de-AT');

  const defectBtn = item.is_defective
    ? `<button class="btn btn-ok" onclick="toggleDefect(${id}, false)">✓ In Ordnung</button>`
    : `<button class="btn btn-danger" onclick="toggleDefect(${id}, true)">⚠ Defekt melden</button>`;

  const lendSection = item.lent_to
    ? `<button class="btn btn-ghost" onclick="returnItem(${id})">📥 Zurück erhalten</button>`
    : `<div class="lend-form">
         <input class="lend-input" id="lend-name-${id}" type="text" placeholder="An wen verleihen?">
         <button class="btn btn-ghost" onclick="lendItem(${id})">📤 Verleihen</button>
       </div>`;

  wrap.innerHTML = `
    <div class="detail-layout">
      <div class="detail-photo">${item.photo_url ? `<img src="${esc(item.photo_url)}" alt="${esc(item.name)}">` : '🔧'}</div>
      <div>
        <div class="item-title">${esc(item.name)}</div>
        ${item.is_defective ? `<div class="status-box status-box-defect"><div class="status-box-icon">⚠️</div><div class="status-box-text"><strong>Als defekt markiert</strong><small>Bitte prüfen oder reparieren lassen</small></div></div>` : ''}
        ${item.lent_to ? `<div class="status-box status-box-lent"><div class="status-box-icon">📤</div><div class="status-box-text"><strong>Verliehen an ${esc(item.lent_to)}</strong><small>Seit ${new Date(item.lent_at).toLocaleDateString('de-AT')}</small></div></div>` : ''}
        ${item.category ? `<div class="info-block"><div class="info-label">Kategorie</div><div class="info-value"><span class="badge badge-category">${esc(item.category)}</span></div></div>` : ''}
        ${item.description ? `<div class="info-block"><div class="info-label">Beschreibung</div><div class="info-value">${esc(item.description)}</div></div>` : ''}
        ${item.location ? `<div class="info-block"><div class="info-label">Aufbewahrungsort</div><div class="info-value">📍 ${esc(item.location)}</div></div>` : ''}
        ${item.quantity ? `<div class="info-block"><div class="info-label">Menge / Anzahl</div><div class="info-value">${esc(item.quantity)}</div></div>` : ''}
        <div class="info-block"><div class="info-label">Erfasst am</div><div class="info-value">${date}</div></div>
        <div class="detail-actions">
          <button class="btn btn-primary" onclick="setHash('edit/${id}')">Bearbeiten</button>
          <button class="btn btn-outline" onclick="setHash('print/${id}')">QR-Etikett</button>
          ${defectBtn}
          <button class="btn btn-danger" onclick="deleteItem(${id})">Löschen</button>
        </div>
        ${lendSection}
      </div>
    </div>`;
}

// ── LEND / RETURN / DEFECT ───────────────────────────────
async function lendItem(id) {
  const input = document.getElementById('lend-name-' + id);
  const name = input?.value?.trim();
  if (!name) { input?.focus(); return; }
  const { error } = await sb.from('items').update({
    lent_to: name,
    lent_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  }).eq('id', id);
  if (error) { showToast('Fehler beim Verleihen.', true); return; }
  showToast('Verliehen an ' + name);
  showDetail(id);
}

async function returnItem(id) {
  if (!confirm('Als zurückgegeben markieren?')) return;
  const { error } = await sb.from('items').update({
    lent_to: null, lent_at: null, updated_at: new Date().toISOString()
  }).eq('id', id);
  if (error) { showToast('Fehler.', true); return; }
  showToast('Zurück erhalten ✓');
  showDetail(id);
}

async function toggleDefect(id, value) {
  const { error } = await sb.from('items').update({
    is_defective: value,
    updated_at: new Date().toISOString()
  }).eq('id', id);
  if (error) { showToast('Fehler.', true); return; }
  showToast(value ? 'Als defekt markiert' : 'Als in Ordnung markiert');
  showDetail(id);
}

// ── FORM ─────────────────────────────────────────────────
let editItem = null;

async function loadCategories() {
  const { data } = await sb.from('items').select('category').not('category', 'is', null).neq('category', '');
  const cats = [...new Set((data||[]).map(r => r.category).filter(Boolean))].sort();
  const dl = document.getElementById('cat-list');
  dl.innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');
}

async function showForm(id) {
  editItem = null;
  document.getElementById('item-form').reset();
  document.getElementById('photo-existing').style.display = 'none';
  document.getElementById('f-id').value = '';
  await loadCategories();

  if (id) {
    showView('form');
    document.getElementById('form-title').textContent = 'Bearbeiten';
    document.getElementById('f-submit').textContent   = 'Speichern';
    document.getElementById('form-back').onclick = () => setHash('detail/' + id);
    document.getElementById('f-cancel').onclick  = () => setHash('detail/' + id);
    const { data: item } = await sb.from('items').select('*').eq('id', id).single();
    if (item) {
      editItem = item;
      document.getElementById('f-id').value       = item.id;
      document.getElementById('f-name').value     = item.name || '';
      document.getElementById('f-category').value = item.category || '';
      document.getElementById('f-desc').value     = item.description || '';
      document.getElementById('f-loc').value      = item.location || '';
      document.getElementById('f-qty').value      = item.quantity || '';
      if (item.photo_url) {
        document.getElementById('photo-thumb').src = item.photo_url;
        document.getElementById('photo-existing').style.display = 'flex';
      }
    }
  } else {
    showView('form');
    document.getElementById('form-title').textContent = 'Neuer Eintrag';
    document.getElementById('f-submit').textContent   = 'Hinzufügen';
    document.getElementById('form-back').onclick = showOverview;
    document.getElementById('f-cancel').onclick  = showOverview;
  }
}

async function submitForm(e) {
  e.preventDefault();
  const btn = document.getElementById('f-submit');
  const id  = document.getElementById('f-id').value;
  btn.disabled = true; btn.textContent = '…';

  const name     = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-category').value.trim() || null;
  const description = document.getElementById('f-desc').value.trim();
  const location = document.getElementById('f-loc').value.trim();
  const quantity = document.getElementById('f-qty').value.trim();
  const file     = document.getElementById('f-photo').files[0];
  const rmPhoto  = document.getElementById('f-rm-photo').checked;

  let photo_url = editItem?.photo_url ?? null;

  if (rmPhoto && editItem?.photo_url) {
    const p = toPath(editItem.photo_url);
    if (p) await sb.storage.from(BUCKET).remove([p]);
    photo_url = null;
  }
  if (file) {
    if (editItem?.photo_url && !rmPhoto) {
      const p = toPath(editItem.photo_url);
      if (p) await sb.storage.from(BUCKET).remove([p]);
    }
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file, { upsert: true });
    if (!upErr) photo_url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  const payload = { name, category, description, location, quantity, photo_url, updated_at: new Date().toISOString() };
  let error;
  if (id) ({ error } = await sb.from('items').update(payload).eq('id', id));
  else    ({ error } = await sb.from('items').insert(payload));

  btn.disabled = false;
  btn.textContent = id ? 'Speichern' : 'Hinzufügen';
  if (error) { showToast('Fehler: ' + error.message, true); return; }
  showToast(id ? 'Gespeichert!' : 'Hinzugefügt!');
  showOverview();
}

// ── DELETE ───────────────────────────────────────────────
async function deleteItem(id) {
  if (!confirm('Wirklich löschen?')) return;
  const { data: item } = await sb.from('items').select('photo_url').eq('id', id).single();
  if (item?.photo_url) { const p = toPath(item.photo_url); if (p) await sb.storage.from(BUCKET).remove([p]); }
  const { error } = await sb.from('items').delete().eq('id', id);
  if (error) { showToast('Fehler beim Löschen.', true); return; }
  showToast('Gelöscht.');
  showOverview();
}

// ── PRINT ────────────────────────────────────────────────
async function showPrint(id) {
  showView('print');
  document.getElementById('print-back').onclick  = () => setHash('detail/' + id);
  document.getElementById('print-back2').onclick = () => setHash('detail/' + id);
  const { data: item } = await sb.from('items').select('*').eq('id', id).single();
  if (!item) return;
  const base = location.origin + location.pathname;
  const itemUrl = base + '#detail/' + id;
  document.getElementById('print-name').textContent = item.name;
  document.getElementById('print-loc').textContent  = item.location ? '📍 ' + item.location : '';
  document.getElementById('print-url').textContent  = itemUrl;
  const qr = qrcode(0, 'M');
  qr.addData(itemUrl);
  qr.make();
  document.getElementById('qr-img').src = qr.createDataURL(4, 0);
}

// ── UTILS ────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toPath(url) { const m = `/object/public/${BUCKET}/`; const i = url.indexOf(m); return i !== -1 ? url.slice(i + m.length) : null; }

let toastT;
function showToast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
